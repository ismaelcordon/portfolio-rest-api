name: Deploy to Server

on:
    pull_request:
        branches:
            - develop
        types:
            - closed

env:
    DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
    deploy:
        if: github.event.pull_request.merged == true
        runs-on: self-hosted
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Log - Starting deployment
              run: |
                  echo "=========================================="
                  echo "Starting deployment for branch: ${{ github.ref_name }}"
                  echo "=========================================="

            - name: Install dependencies
              run: |
                  echo "Installing dependencies..."
                  pnpm install --frozen-lockfile
                  echo "Dependencies installed!"

            - name: Build TypeScript
              run: |
                  echo "Building TypeScript..."
                  pnpm run build
                  echo "Build completed!"

            - name: Clean deployment directory
              run: |
                  echo "Cleaning $DEPLOY_PATH/app..."
                  mkdir -p $DEPLOY_PATH/app
                  rm -rf $DEPLOY_PATH/app/*
                  echo "Directory cleaned!"

            - name: Copy build artifacts
              run: |
                  echo "Copying dist, package.json and .env..."
                  rsync -av $GITHUB_WORKSPACE/dist/ $DEPLOY_PATH/app/dist/
                  cp $GITHUB_WORKSPACE/package.json $DEPLOY_PATH/app/package.json
                  cp $GITHUB_WORKSPACE/package-lock.json $DEPLOY_PATH/app/package-lock.json
                  echo "Files copied!"

            - name: Generate .env
              run: |
                  echo "Generating .env file..."
                  cat > $DEPLOY_PATH/app/.env << EOF
                  PORT=${{ secrets.PORT }}
                  DB_HOST=${{ secrets.DB_HOST }}
                  DB_PORT=${{ secrets.DB_PORT }}
                  DB_NAME=${{ secrets.DB_NAME }}
                  DB_USER=${{ secrets.DB_USER }}
                  DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                  API_KEY=${{ secrets.API_KEY }}
                  SMTP_HOST=${{ secrets.SMTP_HOST }}
                  SMTP_PORT=${{ secrets.SMTP_PORT }}
                  SMTP_SECURE=${{ secrets.SMTP_SECURE }}
                  SMTP_USER=${{ secrets.SMTP_USER }}
                  SMTP_PASS=${{ secrets.SMTP_PASS }}
                  CONTACT_TO=${{ secrets.CONTACT_TO }}
                  CONTACT_FROM=${{ secrets.CONTACT_FROM }}
                  EOF
                  echo ".env generated!"

            - name: Install production dependencies
              run: |
                  echo "Installing production dependencies..."
                  cd $DEPLOY_PATH/app
                  pnpm install --frozen-lockfile --prod
                  echo "Production dependencies installed!"

            - name: Restart server
              run: |
                  echo "Restarting server..."
                  cd $DEPLOY_PATH/app
                  # Añadimos --update-env para que lea el nuevo .env generado
                  pm2 restart portfolio-rest-api --update-env || pm2 start dist/server.js --name portfolio-rest-api
                  echo "Server restarted!"

            - name: Log - Deployment completed
              run: |
                  echo "=========================================="
                  echo "✅ DEPLOYMENT COMPLETED"
                  echo "📦 Files at: $DEPLOY_PATH/app"
                  echo "🌐 Branch: ${{ github.ref_name }}"
                  echo "=========================================="

            - name: Send Telegram Notification
              if: always()
              env:
                  JOB_STATUS: ${{ job.status }}
                  SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  AUTHOR: ${{ github.actor }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  echo "Preparando mensaje de Telegram..."

                  # Definimos el emoji y texto de estado
                  if [ "$JOB_STATUS" = "success" ]; then
                    STATUS_TEXT="✅ <b>DESPLIEGUE EXITOSO</b>"
                  else
                    STATUS_TEXT="❌ <b>ERROR EN EL DESPLIEGUE</b>"
                  fi

                  # Construimos el mensaje usando Markdown
                  MESSAGE=$(cat <<EOF
                  $STATUS_TEXT

                  📦 <b>Proyecto:</b> $REPOSITORY
                  🚀 <b>Entorno:</b> Develop
                  🌿 <b>Rama origen:</b> $SOURCE_BRANCH
                  📝 <b>PR:</b> $PR_TITLE
                  👤 <b>Autor:</b> $AUTHOR
                  EOF
                  )

                  # Enviamos el mensaje a la API de Telegram
                  curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
                    -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                    -d text="$MESSAGE" \
                    -d parse_mode="HTML"
