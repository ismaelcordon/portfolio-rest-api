name: Deploy to Server

on:
    pull_request:
        branches:
            - develop
    workflow_dispatch:

env:
    DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
    deploy:
        if: github.event.pull_request.merged == true
        runs-on: self-hosted
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Log - Starting deployment
              run: |
                  echo "======================================================"
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "Starting MANUAL deployment on branch: ${{ github.ref_name }}"
                  else
                    echo "Starting deployment for branch: ${{ github.ref_name }}"
                  fi
                  echo "======================================================"

            - name: Install dependencies
              run: |
                  echo "Installing dependencies..."
                  pnpm install --frozen-lockfile
                  echo "Dependencies installed!"

            - name: Build TypeScript
              run: |
                  echo "Building TypeScript..."
                  pnpm run build
                  echo "Build completed!"

            - name: Clean deployment directory
              run: |
                  echo "Cleaning $DEPLOY_PATH/app..."
                  mkdir -p $DEPLOY_PATH/app
                  rm -rf $DEPLOY_PATH/app/*
                  echo "Directory cleaned!"

            - name: Copy build artifacts
              run: |
                  echo "Copying dist, package.json and .env..."
                  rsync -av $GITHUB_WORKSPACE/dist/ $DEPLOY_PATH/app/dist/
                  cp $GITHUB_WORKSPACE/package.json $DEPLOY_PATH/app/package.json
                  cp $GITHUB_WORKSPACE/pnpm-lock.yaml $DEPLOY_PATH/app/pnpm-lock.yaml
                  echo "Files copied!"

            - name: Generate .env
              run: |
                  echo "Generating .env file..."
                  cat > $DEPLOY_PATH/app/.env << EOF
                  PORT=${{ secrets.PORT }}
                  DB_HOST=${{ secrets.DB_HOST }}
                  DB_PORT=${{ secrets.DB_PORT }}
                  DB_NAME=${{ secrets.DB_NAME }}
                  DB_USER=${{ secrets.DB_USER }}
                  DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                  API_KEY=${{ secrets.API_KEY }}
                  SMTP_HOST=${{ secrets.SMTP_HOST }}
                  SMTP_PORT=${{ secrets.SMTP_PORT }}
                  SMTP_SECURE=${{ secrets.SMTP_SECURE }}
                  SMTP_USER=${{ secrets.SMTP_USER }}
                  SMTP_PASS=${{ secrets.SMTP_PASS }}
                  CONTACT_TO=${{ secrets.CONTACT_TO }}
                  CONTACT_FROM=${{ secrets.CONTACT_FROM }}
                  ASSETS_PATH=${{ secrets.ASSETS_PATH }}
                  EOF
                  echo ".env generated!"

            - name: Install production dependencies
              run: |
                  echo "Installing production dependencies..."
                  cd $DEPLOY_PATH/app
                  pnpm install --frozen-lockfile --prod
                  echo "Production dependencies installed!"

            - name: Restart server
              run: |
                  echo "Restarting server..."
                  cd $DEPLOY_PATH/app
                  # Añadimos --update-env para que lea el nuevo .env generado
                  pm2 restart portfolio-rest-api --update-env || pm2 start dist/server.js --name portfolio-rest-api
                  echo "Server restarted!"

            - name: Log - Deployment completed
              run: |
                  echo "=========================================="
                  echo "✅ DEPLOYMENT COMPLETED"
                  echo "📦 Files at: $DEPLOY_PATH/app"
                  echo "🌐 Branch: ${{ github.ref_name }}"
                  echo "=========================================="

            - name: Send Telegram Notification
              if: always()
              env:
                  JOB_STATUS: ${{ job.status }}
                  AUTHOR: ${{ github.actor }}
                  REPOSITORY: ${{ github.repository }}
                  BRANCH: ${{ github.ref_name }}
                  COMMIT_SHA: ${{ github.sha }}
                  COMMIT_MSG: ${{ github.event.head_commit.message }}
                  EVENT_NAME: ${{ github.event_name }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

              run: |
                  echo "Preparando mensaje de Telegram..."

                  # Status
                  if [ "$JOB_STATUS" = "success" ]; then
                    STATUS_TEXT="✅ <b>DESPLIEGUE EXITOSO</b>"
                  else
                    STATUS_TEXT="❌ <b>DEPLOYMENT FAILED</b>"
                  fi

                  # Trigger origin
                  if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                    TRIGGER_TEXT="🖐 Manually triggered"
                  elif [ -n "$PR_TITLE" ]; then
                    TRIGGER_TEXT="🔀 PR: <i>${PR_TITLE}</i>"
                  else
                    TRIGGER_TEXT="⬆️ Push to <b>${BRANCH}</b>"
                  fi

                  # Short commit SHA
                  SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)

                  MESSAGE=$(cat <<EOF
                    $STATUS_TEXT
                    $TRIGGER_TEXT

                    📦 <b>Repo:</b> $REPOSITORY
                    🌿 <b>Branch:</b> $BRANCH
                    🔖 <b>Commit:</b> <code>$SHORT_SHA</code> — $COMMIT_MSG
                    👤 <b>Author:</b> $AUTHOR
                    🔗 <a href="$RUN_URL">View run</a>
                  EOF)

                  # Enviamos el mensaje a la API de Telegram
                  curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
                    -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                    -d text="$MESSAGE" \
                    -d parse_mode="HTML"

            - name: Log
              run: |
                  echo "=========================================="
                  echo "✅ DEPLOYMENT COMPLETED"
                  echo "=========================================="
